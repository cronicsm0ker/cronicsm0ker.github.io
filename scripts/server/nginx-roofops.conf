# RoofOps API — Nginx reverse proxy. Placeholders __ROOFOPS_DOMAIN__ and
# __ROOFOPS_API_PORT__ are substituted by bootstrap.sh.

upstream roofops_api {
    server 127.0.0.1:__ROOFOPS_API_PORT__;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __ROOFOPS_DOMAIN__;

    # certbot will inject the TLS server block + redirect after issuance.
    location / {
        proxy_pass http://roofops_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        client_max_body_size 25m;
    }

    # Allow Let's Encrypt http-01 challenges.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Lightweight Nginx-level health endpoint (does not hit the API).
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
